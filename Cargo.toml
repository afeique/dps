[package]
name = "dps"
version = "0.1.0"
edition = "2024"
description = "Dark Prism Solid — a native Rust + Bevy port of the Rainboids single-player game, built for best-in-class graphics (HDR bloom, glow, GPU-compute particles)."
authors = ["Afeique Sheikh"]
license-file = "LICENSE"
publish = false

[dependencies]
# `wav` enables rodio's WAV decoder — the native SFX synth (src/audio.rs) plays
# PCM-16 WAV byte buffers it generates + the recorded `sfx/*.wav`. `mp3` enables
# decoding the local `music/*.mp3` tracks streamed by src/music.rs.
bevy = { version = "0.18.1", features = ["wav", "mp3"] }
# Vector-path → Mesh2d tessellation: port the Canvas2D silhouettes from
# `shapes.js` to lyon paths. Glow comes from HDR-emissive colors + camera bloom
# (not per-shape blur). See docs/port-plan.md §3.1.
bevy_prototype_lyon = "0.16.0"
# GPU-compute particles (explosions, trails, debris) — the payoff over the web
# build's 600-particle cap. 2D-only (no 3d/serde). See docs/port-plan.md §3.2.
bevy_hanabi = { version = "0.18.0", default-features = false, features = ["2d"] }
# Meta-progression persistence (ME): the account profile is serialized as RON
# in the OS config dir so it survives across runs (progression.js + storage.js).
serde = { version = "1", features = ["derive"] }
ron = "0.8"
dirs = "5"
# Immediate-mode GUI for the BUILD-tree / loadout screens (Phase UI). Styled to
# match the HDR neon aesthetic. Tracks Bevy 0.18.
bevy_egui = "0.39"

# ── Build-speed profiles (Bevy's recommended dev setup) ──────────────
# Compile our own code with light optimization, but optimize all
# dependencies (Bevy + friends) fully so the dev runtime is fast while
# incremental rebuilds of *our* crate stay quick.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# ── Release tuning ───────────────────────────────────────────────────
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
